name: Windows build and stable release

on:
  push:
    branches: [ui-redesign, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          New-Item -ItemType Directory -Force build-reports | Out-Null
          python -m pip freeze | Set-Content -Encoding utf8 build-reports/dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency inventory failed." }

      - name: Run the complete isolated test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/run_isolated_tests.py
          if ($LASTEXITCODE -ne 0) { throw "The isolated test suite failed." }

      - name: Build the complete Windows application
        run: |
          & ./build_windows.ps1 -Python (Get-Command python).Source *>&1 |
            Tee-Object -FilePath build-reports/build.log
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed." }

      - name: Smoke test the packaged demo with the Windows Qt platform
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist/VRChatDanceAssistant/VRChatDanceAssistant.exe"
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "build-reports/frozen-smoke.json"
          $statePath = Join-Path $env:RUNNER_TEMP "pypydance-frozen-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "The packaged executable is missing."
          }
          $arguments = @("--demo", "--state-dir", "`"$statePath`"", "--smoke-test-report", "`"$reportPath`"")
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -PassThru `
            -WorkingDirectory (Split-Path $exePath)
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "The packaged demo did not exit within 120 seconds."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "The packaged demo exited with code $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "The packaged demo did not write its smoke-test report."
          }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.status -ne "passed" -or $report.frozen -ne $true -or
              $report.platform -ne "win32" -or $report.qt_platform -ne "windows") {
            throw "The smoke-test report did not confirm a passing frozen application using native Windows Qt."
          }
          Get-Content -Raw -LiteralPath $reportPath

      - name: Prepare release ZIP, checksum, and provenance
        run: |
          python tools/package_windows.py
          if ($LASTEXITCODE -ne 0) { throw "Release asset preparation failed." }

      - name: Upload the verified Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: VRChatDanceAssistant-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: build-reports/
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    needs: windows-x64
    if: >-
      github.repository == 'oreochromis/pypydance-video-cache' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download this run's verified Windows assets
        uses: actions/download-artifact@v4
        with:
          name: VRChatDanceAssistant-windows-x64
          path: release

      - name: Publish the requested stable Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_windows_preview.py --assets release
